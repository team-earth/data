series_title: "Unsolvable: Think Again!"
author: "Kevin Kells, PhD"
series_description: >
  The "Unsolvable: Think Again!" series offers whole-system frameworks for solving
  complex societal challenges. Each book identifies a Future Picture for a major issue,
  then uses AI-assisted analysis to break the problem into parts and map thousands of
  active or potential solutions. Designed for individuals, communities, organizations,
  and policymakers, these books empower collaborative problem-solving at scale.
